[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "paper-harness-professional"
version = "0.1.0"
description = "An auditable multi-agent Auto-Research harness for professional research"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [{name = "paper-harness contributors"}]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
paper-harness = "paper_harness.cli:main"

[tool.setuptools.packages.find]
include = ["paper_harness*"]
